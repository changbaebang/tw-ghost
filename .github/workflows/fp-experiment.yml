# TEMPORARY — issue #31. Uploads tw-ghost's SARIF for .fp-experiment/ to measure how code scanning
# tracks alerts when several findings share one primaryLocationLineHash. Delete with the branch.
name: fingerprint-experiment

on:
  push:
    branches: [exp/sarif-fingerprint]

permissions:
  contents: read
  security-events: write

jobs:
  fp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Never fail: this job exists to upload, not to gate.
      - run: |
          node dist/cli.js --format sarif --no-suggestions --fail-on none \
            --config .fp-experiment/tailwind.config.js > tw-ghost.sarif
          node -e "
            const l = require('./tw-ghost.sarif');
            for (const r of l.runs[0].results) {
              const p = r.locations[0].physicalLocation;
              console.log(p.artifactLocation.uri, p.region.startLine, p.region.startColumn,
                r.message.text.split(' ')[0], JSON.stringify(r.partialFingerprints));
            }
          "
      - uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          sarif_file: tw-ghost.sarif
          category: tw-ghost-fp-experiment
